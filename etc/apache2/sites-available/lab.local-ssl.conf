<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName lab.local
    ServerAlias www.lab.local
    DocumentRoot /var/www/lab.local/html

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/lab.local.crt
    SSLCertificateKeyFile /etc/ssl/private/lab.local.key

    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY

    ErrorLog ${APACHE_LOG_DIR}/lab.local_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/lab.local_ssl_access.log combined
</VirtualHost>
</IfModule>
