<VirtualHost *:80>
    ServerName blog.lab.local
    ServerAlias www.blog.lab.local
    DocumentRoot /var/www/blog.lab.local/html
    DirectoryIndex index.html index.php

    ErrorLog ${APACHE_LOG_DIR}/blog.lab.local_error.log
    CustomLog ${APACHE_LOG_DIR}/blog.lab.local_access.log combined

    <Directory /var/www/blog.lab.local/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
