<VirtualHost *:80>
    ServerName lab.local
    ServerAlias www.lab.local
    DocumentRoot /var/www/lab.local/html
    DirectoryIndex index.html index.php

    ErrorLog ${APACHE_LOG_DIR}/lab.local_error.log
    CustomLog ${APACHE_LOG_DIR}/lab.local_access.log combined

    Redirect permanent / https://lab.local/

    <Directory /var/www/lab.local/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
